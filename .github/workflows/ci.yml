name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and authorization tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Check tracked public configuration
        shell: pwsh
        run: ./scripts/Test-PublicConfiguration.ps1
      - name: Restore solution
        run: dotnet restore Mango.sln
      - name: Build solution
        run: dotnet build Mango.sln --configuration Release --no-restore
      - name: Restore authorization tests
        run: dotnet restore tests/Authorization.Tests/Authorization.Tests.csproj
      - name: Run authorization regressions
        run: dotnet test tests/Authorization.Tests/Authorization.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
