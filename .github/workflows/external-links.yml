name: External link monitor

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    name: External link health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public HTTP destinations
        run: python3 scripts/check_link_health.py --external
